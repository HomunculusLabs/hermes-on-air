name: on-air
label: On Air
kind: platform
version: "0.1.0"
manifest_version: 2
api_version: 1
description: >-
  Let your Hermes agent co-host a live stream, safely. Reads Twitch chat (anonymous,
  read-only), answers what is worth answering, stays silent on bait, guards every line
  before it reaches captions or voice, fills dead air with your own show content, and
  drives an OBS browser-source overlay with support alerts and a desk for approval, privacy cut and mute.
author: HomunculusLabs
license: MIT
homepage: https://github.com/HomunculusLabs/hermes-on-air
tags: [gateway, streaming, twitch, obs, vtuber, safety]
requires_hermes: ">=0.22.7"
# The runtime gate: an llm_execution middleware refuses any On Air provider request carrying tools or
# Hermes memory context; pre_llm_call skips inference while the show is not armed.
provides_hooks: [pre_llm_call, post_llm_call, on_session_end]
provides_middleware: [llm_execution]
# The private-agent setup entry (owner homes only; a stage home registers none of these).
provides_tools: [onair_setup_schema, onair_setup_status, onair_setup_plan, onair_setup_progress, onair_setup_cancel, onair_preview_safety, onair_stage_status, onair_stage_plan, onair_stage_control, onair_stage_host_turn, onair_stage_safety, onair_show_plan, onair_show_status, onair_show_chat, onair_show_safety, onair_work_share, onair_present_status, onair_present_publish, onair_present_control, onair_obs_setup, onair_obs_scene, onair_window_share, onair_broadcast, onair_layout]
optional_env:
  - name: ONAIR_TWITCH_CHANNEL
    description: "Twitch channel to read chat from (read-only, anonymous)"
    prompt: "Twitch channel"
    password: false
  - name: ONAIR_OVERLAY_PORT
    description: "Loopback port for the OBS browser-source overlay (default 18790)"
    prompt: "Overlay port"
    password: false
  - name: ONAIR_OBS_URL
    description: "OBS WebSocket URL (loopback only, default ws://127.0.0.1:4455)"
    prompt: "OBS WebSocket URL"
    password: false
  - name: ONAIR_OBS_PASSWORD
    description: "OBS WebSocket server password (read at call time, never returned)"
    prompt: "OBS WebSocket password"
    password: true
  - name: ONAIR_PRESENT_PORT
    description: "Loopback port for the presentation page (default 18795)"
    prompt: "Presentation port"
    password: false
  - name: ONAIR_JEV_API_KEY
    description: "Optional TypeSafe Jev key, only for semantic_assist provider jev (shadow advice; never approves)"
    prompt: "Jev API key (optional)"
    password: true
config_schema:
  twitch_channel: {type: str, default: "", description: "Twitch channel to read (without #)"}
  overlay_port: {type: int, default: 18790, description: "Loopback port for the OBS overlay"}
  seed_bank: {type: str, default: "", description: "Path to your seed-bank YAML (show content for dead air)"}
  never_say: {type: list, default: [], description: "Words or phrases the host must never say on air"}
  profanity: {type: str, default: "mask", enum: [allow, mask, block], description: "Profanity policy: mask, block, or allow; slurs are always blocked"}
  voice: {type: bool, default: true, description: "Use Hermes text-to-speech for released lines; false is captions only"}
  host_name: {type: str, default: "Host", description: "Name of the human host, protected from impersonation"}
  host_turns: {type: bool, default: false, description: "Allow owner host lines on the real stage"}
  host_relay_settle_seconds: {type: int, default: 20, description: "Relay settling window after privacy or re-arming (5 to 120 seconds)"}
  host_mic: {type: bool, default: false, description: "Allow push-to-talk host microphone in the desk"}
  host_mic_open: {type: bool, default: false, description: "Allow owner-activated open microphone with direct transcripts"}
  host_mic_timeout_seconds: {type: int, default: 20, description: "Dashboard profile speech-to-text timeout in seconds (5 to 120)"}
  host_mic_review: {type: bool, default: true, description: "Require hold-to-talk transcript review; Open mic has its own separate setting"}
  host_cut_in_on_talk: {type: bool, default: true, description: "Cut an airing co-host line when the owner speaks"}
  host_relay_autonomous: {type: bool, default: false, description: "Allow host relays in autonomous mode without owner approval"}
  dead_air_seconds: {type: int, default: 45, description: "Quiet seconds before a content beat"}
  model_failure_pause_after: {type: int, default: 3, description: "Consecutive model failures before pausing turns"}
  reply_pacing: {type: str, default: "normal", enum: [normal, less_often, rare], description: "How often chat gets a reply (set by On Air setup; see onair/style.py)"}
  public_style: {type: dict, default: {}, description: "The co-host's public style chosen in On Air setup (persona line, tone, topics, avoid_topics, reply_length); also written to the stage SOUL.md"}
  alerts: {type: dict, default: {enabled: true, thank_you: true, include_messages: false, min_bits: 1, during_privacy: drop}, description: "Support alerts: subs, gifted subs, bits and raids (overlay alert plus one guarded thank-you)"}
  semantic_assist: {type: dict, default: {provider: "off", endpoint: "http://127.0.0.1:8390", timeout_s: 3, show_policy: "", min_confidence: 0.6}, description: "Optional shadow-only advice beside queued lines: provider off (default), laya (loopback guardrail service) or jev (needs ONAIR_JEV_API_KEY). Advice never approves or airs anything."}
  presentation: {type: dict, default: {}, description: "Presentation, text-only work view, and OBS output: obs_url, present_port, overlay_url/overlay_port (default: the running private show's own captions+voice page), approved_scenes, owned scene/input names; image sharing is not supported"}
